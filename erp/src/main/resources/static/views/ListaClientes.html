<div class="p-6">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Clientes (Shopify)</h1>

  <div class="mb-6 flex items-end gap-6">
    <div class="flex-1 relative group">
      <div
        class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
      >
        <i
          class="fa-solid fa-magnifying-glass text-gray-300 group-hover:text-aliva-purple focus-within:text-aliva-purple"
        ></i>
      </div>
      <input
        type="text"
        id="searchBox"
        placeholder="Buscar en cualquier columna..."
        class="w-full pl-12 pr-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-blue focus:border-transparent"
      />
    </div>

    <div class="flex gap-3">
      <button
        class="bg-aliva-blue ring-2 ring-aliva-blue hover:bg-white text-white p-3 rounded-lg shadow-sm transition-colors group"
      >
        <i class="fa-solid fa-download group-hover:text-aliva-blue"></i>
      </button>
    </div>
  </div>

  <div
    class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden"
  >
    <div
      id="clientesGrid"
      class="ag-theme-alpine"
      style="height: 480px; width: 100%"
    ></div>
  </div>
</div>

<!-- Modal Detalle Cliente -->
<div
  id="modalDetalleCliente"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden"
>
  <div
    class="bg-white rounded-lg shadow-xl w-full max-w-3xl mx-4 max-h-[85vh] overflow-y-auto"
  >
    <div class="flex justify-between items-center border-b p-4">
      <h2 class="text-xl font-bold text-gray-800">Detalle del Cliente</h2>
      <button
        data-modal-close="modalDetalleCliente"
        class="text-gray-400 hover:text-gray-600"
      >
        <i class="fa-solid fa-xmark text-2xl"></i>
      </button>
    </div>
    <div class="p-6 space-y-4">
      <div>
        <p class="text-sm text-gray-600">Nombre:</p>
        <p id="clienteNombre" class="font-semibold text-gray-900"></p>
      </div>
      <div>
        <p class="text-sm text-gray-600">Teléfono:</p>
        <p id="clienteTelefono" class="font-semibold text-gray-900"></p>
      </div>
      <div>
        <p class="text-sm text-gray-600">Correo:</p>
        <p id="clienteCorreo" class="font-semibold text-gray-900"></p>
      </div>
      <div>
        <p class="text-sm text-gray-600">Fecha Registro:</p>
        <p id="clienteFecha" class="font-semibold text-gray-900"></p>
      </div>

      <hr class="my-4" />
      <h3 class="text-lg font-semibold text-gray-800 mb-2">
        Actividad reciente
      </h3>
      <ul id="clienteLogs" class="divide-y divide-gray-200"></ul>
    </div>
  </div>
</div>
