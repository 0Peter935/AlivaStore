<header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-4">
      <span id="userRol" class="text-gray-500">Rol</span>
    </div>

    <div class="relative">
      <button
        class="flex items-center gap-2 text-gray-700 hover:text-gray-900"
        data-dropdown-btn
      >
        <span id="userNombre">Usuario</span>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </button>

      <div
        id="userDropdown"
        class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-10"
      >
        <a
          data-modal-open="perfilModal"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 cursor-pointer"
          >Perfil</a
        >
        <a
          data-modal-open="changePasswordModal"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 cursor-pointer"
          >Cambiar Contraseña</a
        >
        <hr class="my-1 border-gray-200" />
        <a href="/logout" class="block px-4 py-2 text-gray-700 hover:bg-gray-50"
          >Cerrar Sesión</a
        >
      </div>
    </div>
  </div>
</header>

<div
  id="perfilModal"
  class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden"
>
  <div
    class="bg-white rounded-lg shadow-xl w-full max-w-4xl mx-4 max-h-[90vh] overflow-y-auto"
  >
    <div class="flex items-center justify-between p-6 border-b">
      <h2 class="text-2xl font-bold text-gray-900">Mi Perfil</h2>
      <button
        data-modal-close="perfilModal"
        class="text-gray-400 hover:text-gray-600 transition-colors"
      >
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>

    <div class="p-6">
      <form id="profileForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Nombres Completos:</label
            >
            <input
              type="text"
              id="nombresInput"
              placeholder="Ingrese su nombre"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Apellido Paterno:</label
            >
            <input
              type="text"
              id="apPaternoInput"
              placeholder="Ingrese su apellido paterno"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Apellido Materno:</label
            >
            <input
              type="text"
              id="apMaternoInput"
              placeholder="Ingrese su apellido materno"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Correo Electrónico:</label
            >
            <input
              type="email"
              id="correoInput"
              placeholder="Ingrese su correo"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Teléfono:</label
            >
            <input
              type="tel"
              id="telefonoInput"
              placeholder="Ingrese su teléfono"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
          <div></div>
        </div>

        <hr class="border-gray-200" />

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Usuario:</label
            >
            <input
              type="text"
              id="usuarioInput"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
              disabled
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Contraseña:</label
            >
            <div class="relative">
              <input
                type="password"
                id="passwordInput"
                class="w-full px-4 py-3 pr-12 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
                disabled
              />
              <button
                type="button"
                id="togglePasswordPerfil"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 p-1 text-aliva-purple hover:text-aliva-blue transition-colors"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Rol:</label
            >
            <input
              type="text"
              id="rolInput"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
              disabled
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Fecha de Registro:</label
            >
            <input
              type="text"
              id="fechaRegistroInput"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
              disabled
            />
          </div>
        </div>

        <div class="flex justify-end gap-4 pt-6 border-t">
          <button
            data-modal-close="perfilModal"
            class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="px-6 py-2 bg-aliva-purple hover:bg-aliva-blue text-white rounded-lg transition-colors"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div
  id="changePasswordModal"
  class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden"
>
  <div class="bg-white rounded-lg shadow-2xl w-full max-w-md mx-4 p-6 relative">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-gray-900">Cambiar Contraseña</h2>
      <button
        data-modal-close="changePasswordModal"
        class="text-gray-400 hover:text-gray-600 transition-colors"
      >
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>

    <form id="changePasswordForm" class="space-y-6">
      <div>
        <label
          for="newPassword"
          class="block text-sm font-medium text-gray-700 mb-2"
          >Contraseña Nueva:</label
        >
        <div class="relative">
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder=""
            class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
          />
          <button
            type="button"
            onclick="togglePassword('newPassword', 'eyeIcon1')"
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-aliva-purple hover:text-aliva-blue transition-colors"
          >
            <svg
              id="eyeIcon1"
              class="w-5 h-5"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
              <path
                fill-rule="evenodd"
                d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label
          for="confirmPassword"
          class="block text-sm font-medium text-gray-700 mb-2"
          >Confirmar Contraseña:</label
        >
        <div class="relative">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder=""
            class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
          />
          <button
            type="button"
            onclick="togglePassword('confirmPassword', 'eyeIcon2')"
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-aliva-purple hover:text-aliva-blue transition-colors"
          >
            <svg
              id="eyeIcon2"
              class="w-5 h-5"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
              <path
                fill-rule="evenodd"
                d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="flex justify-end gap-4 pt-4 border-t">
        <button
          data-modal-close="changePasswordModal"
          class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-6 py-2 bg-aliva-purple hover:bg-aliva-blue text-white rounded-lg transition-colors"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
