<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALIVA PERÚ - Dashboard</title>
    <script src="/js/global-preload.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css"
    />
  </head>

  <body class="h-full bg-gray-100">
    <div class="flex h-full">
      <div id="sidebar-container"></div>

      <div class="flex-1 flex flex-col">
        <div id="header-container"></div>

        <main id="main-content" class="flex-1 p-6 overflow-y-auto"></main>
      </div>
    </div>
    <script>
      setTimeout(() => {
        window.dispatchEvent(new Event("resize"));
      }, 50);
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/ag-grid-community@31.3.0/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/navar.js"></script>
    <script src="js/header.js"></script>
  </body>
</html>
