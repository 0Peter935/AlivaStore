<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALIVA PERÚ - Dashboard</title>
    <script src="/js/global-preload.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css"
    />
  </head>
  <body class="h-full bg-gray-100">
    <div class="flex h-full">
      <div id="sidebar-container"></div>

      <div class="flex-1 flex flex-col">
        <div id="header-container"></div>

        <main
          id="main-content"
          class="flex-1 p-6 overflow-y-auto h-[calc(100vh-80px)]"
        >
          <button
            id="btnSyncShopify"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-md transition"
          >
            🔄 Sincronizar Productos
          </button>

          <button
            id="btnSyncClientesShopify"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-md transition"
          >
            🔄 Sincronizar Clientes
          </button>

          <button
            id="btnSyncPedidosShopify"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-md transition"
          >
            🔄 Sincronizar Pedidos
          </button>
        </main>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/ag-grid-community@31.3.0/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/js/navar.js" defer></script>
    <script src="/js/header.js" defer></script>

    <script src="/js/Sincronizar.js" defer></script>
  </body>
</html>
