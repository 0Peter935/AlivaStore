<header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-4">
      <span id="userRol" class="text-gray-500">Rol</span>
    </div>

    <div class="relative">
      <button
        class="flex items-center gap-2 text-gray-700 hover:text-gray-900"
        data-dropdown-btn
      >
        <span id="userNombre">Usuario</span>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </button>

      <div
        id="userDropdown"
        class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-10"
      >
        <a
          data-modal-open="perfilModal"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 cursor-pointer"
          >Perfil</a
        >
        <a
          data-modal-open="changePasswordModal"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-50 cursor-pointer"
          >Cambiar Contraseña</a
        >
        <hr class="my-1 border-gray-200" />
        <a href="/logout" class="block px-4 py-2 text-gray-700 hover:bg-gray-50"
          >Cerrar Sesión</a
        >
      </div>
    </div>
  </div>
</header>

<div
  id="perfilModal"
  class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden"
>
  <div
    class="bg-white rounded-lg shadow-xl w-full max-w-4xl mx-4 max-h-[90vh] overflow-y-auto"
  >
    <div class="flex items-center justify-between p-6 border-b">
      <h2 class="text-2xl font-bold text-gray-900">Mi Perfil</h2>
      <button
        data-modal-close="perfilModal"
        class="text-gray-400 hover:text-gray-600 transition-colors"
      >
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>

    <div class="p-6">
      <form id="profileForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Nombres Completos:</label
            >
            <input
              type="text"
              id="nombresInput"
              placeholder="Ingrese su nombre"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Apellido Paterno:</label
            >
            <input
              type="text"
              id="apPaternoInput"
              placeholder="Ingrese su apellido paterno"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Apellido Materno:</label
            >
            <input
              type="text"
              id="apMaternoInput"
              placeholder="Ingrese su apellido materno"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Correo Electrónico:</label
            >
            <input
              type="email"
              id="correoInput"
              placeholder="Ingrese su correo"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Teléfono:</label
            >
            <input
              type="tel"
              id="telefonoInput"
              placeholder="Ingrese su teléfono"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
            />
          </div>
          <div></div>
        </div>

        <hr class="border-gray-200" />

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Usuario:</label
            >
            <input
              type="text"
              id="usuarioInput"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
              disabled
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Contraseña:</label
            >
            <div class="relative">
              <input
                type="password"
                id="passwordInput"
                class="w-full px-4 py-3 pr-12 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
                disabled
              />
              <button
                type="button"
                id="togglePasswordPerfil"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 p-1 text-aliva-purple hover:text-aliva-blue transition-colors"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Rol:</label
            >
            <input
              type="text"
              id="rolInput"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
              disabled
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Fecha de Registro:</label
            >
            <input
              type="text"
              id="fechaRegistroInput"
              class="w-full px-4 py-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-purple focus:border-transparent transition-all"
              disabled
            />
          </div>
        </div>

        <div class="flex justify-end gap-4 pt-6 border-t">
          <button
            data-modal-close="perfilModal"
            class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors"
          >
            Cancelar
          </button>
          <button
            type="submit"
            class="px-6 py-2 bg-aliva-purple hover:bg-aliva-blue text-white rounded-lg transition-colors"
          >
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div
  id="modalCambiarPassword"
  class="modal-overlay fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50"
>
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 relative">

    <!-- Header -->
    <div class="flex justify-between items-center pb-4 border-b">
      <h2 class="text-xl font-semibold text-gray-800">Cambiar contraseña</h2>
      <button 
        class="text-gray-500 hover:text-gray-700"
        data-modal-close="modalCambiarPassword"
      >
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <!-- Form -->
    <div class="mt-4 space-y-5">
      
      <!-- Nueva contraseña -->
      <div>
        <label class="text-sm font-medium text-gray-700">Nueva contraseña</label>
        <div class="relative mt-1">
          <input
            type="password"
            id="pwNueva"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-aliva-purple focus:border-aliva-purple"
          />
          <button 
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-aliva-purple"
            data-toggle="pwNueva"
          >
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Confirmar contraseña -->
      <div>
        <label class="text-sm font-medium text-gray-700">Confirmar contraseña</label>
        <div class="relative mt-1">
          <input
            type="password"
            id="pwConfirmar"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-aliva-purple focus:border-aliva-purple"
          />
          <button 
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-aliva-purple"
            data-toggle="pwConfirmar"
          >
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-3 pt-4 border-t">
        <button 
          data-modal-close="modalCambiarPassword"
          class="px-5 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100"
        >
          Cancelar
        </button>

        <button 
          id="btnGuardarPassword"
          class="px-5 py-2 bg-aliva-purple hover:bg-aliva-blue text-white rounded-lg"
        >
          Guardar
        </button>
      </div>

    </div>
  </div>
</div>
