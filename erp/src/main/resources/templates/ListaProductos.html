<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALIVA PERÚ - Dashboard</title>
    <script src="/js/global-preload.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="/css/ListaProductos.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css"
    />
  </head>
  <body class="h-full bg-gray-100">
    <div class="flex h-full">
      <div id="sidebar-container"></div>

      <div class="flex-1 flex flex-col">
        <div id="header-container"></div>

        <main
          id="main-content"
          class="flex-1 p-6 overflow-y-auto h-[calc(100vh-80px)]"
        >
          <div class="flex-1 p-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">
              Lista de Productos
            </h1>

            <div class="mb-6 flex items-end gap-6">
              <div class="flex-1 relative group">
                <div
                  class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
                >
                  <i
                    class="fa-solid fa-magnifying-glass text-gray-300 group-hover:text-aliva-purple focus-within:text-aliva-purple"
                  ></i>
                </div>
                <input
                  type="text"
                  id="searchBox"
                  placeholder="Buscar en cualquier columna..."
                  class="w-full pl-12 pr-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-aliva-blue focus:border-transparent"
                />
              </div>

              <div class="flex gap-3">
                <button
                  onclick="abrirModalNuevoProducto()"
                  class="bg-aliva-blue ring-2 ring-aliva-blue hover:bg-white text-white p-3 rounded-lg shadow-sm transition-colors group"
                >
                  <i
                    class="fa-solid fa-square-plus group-hover:text-aliva-blue"
                  ></i>
                </button>

                <button
                  class="bg-aliva-blue ring-2 ring-aliva-blue hover:bg-white text-white p-3 rounded-lg shadow-sm transition-colors group"
                >
                  <i
                    class="fa-solid fa-download group-hover:text-aliva-blue"
                  ></i>
                </button>
              </div>
            </div>

            <!-- Data Table -->
            <div
              class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden"
            >
              <div
                id="productosGrid"
                class="ag-theme-alpine"
                style="height: 440px; width: 100%"
              ></div>
            </div>
          </div>

          <!-- Modal de edición de stock -->
          <div
            id="modalEditarStock"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40"
          >
            <div
              class="bg-white rounded-lg shadow-xl w-[600px] max-h-[80vh] overflow-y-auto p-6 relative"
            >
              <div
                id="infoProductoStock"
                class="bg-blue-50 border border-blue-200 text-blue-900 rounded-md px-4 py-2 mb-3 text-sm font-medium"
              >
                <i class="fa-solid fa-box mr-1"></i>
                Producto seleccionado:
                <span id="productoDescripcion" class="font-semibold">—</span>
              </div>

              <h2 class="text-xl font-bold text-gray-800 mb-4">
                Editar stock por almacén
              </h2>

              <input type="hidden" id="idProductoStock" />

              <!-- Contenedor de filas dinámicas -->
              <div id="stockContainer" class="space-y-3 mb-4"></div>

              <!-- Botón para agregar nueva fila -->
              <button
                id="btnAgregarStock"
                class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-all"
              >
                <i class="fa-solid fa-plus mr-1"></i> Agregar nuevo almacén
              </button>

              <div class="flex justify-end mt-6 gap-3">
                <button
                  onclick="cerrarModalStock()"
                  class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400 transition-all"
                >
                  Cancelar
                </button>
                <button
                  onclick="guardarCambiosStock()"
                  class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 transition-all"
                >
                  Guardar
                </button>
              </div>
            </div>
          </div>

          <!-- Modal: Agregar nuevo producto -->
          <div
            id="modalNuevoProducto"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
          >
            <div
              class="bg-white rounded-2xl shadow-2xl w-[550px] max-h-[90vh] overflow-y-auto border border-gray-100 animate-fadeIn relative"
            >
              <!-- Header -->
              <div
                class="flex justify-between items-center px-6 py-4 border-b border-gray-100"
              >
                <h2
                  class="text-xl font-semibold text-gray-800 flex items-center gap-2"
                >
                  <i class="fa-solid fa-box text-aliva-blue"></i>
                  Nuevo producto
                </h2>
                <button
                  onclick="cerrarModalNuevoProducto()"
                  class="text-gray-400 hover:text-gray-600 transition"
                >
                  <i class="fa-solid fa-xmark text-xl"></i>
                </button>
              </div>

              <!-- Body -->
              <form id="formNuevoProducto" class="p-6 space-y-5">
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="text-sm font-medium text-gray-600"
                      >Código</label
                    >
                    <input
                      type="text"
                      id="npCodProducto"
                      required
                      class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 focus:ring-2 focus:ring-aliva-blue focus:outline-none"
                      placeholder="P001"
                    />
                  </div>
                  <div>
                    <label class="text-sm font-medium text-gray-600"
                      >Precio (S/)</label
                    >
                    <input
                      type="number"
                      id="npPrecio"
                      step="0.01"
                      min="0"
                      required
                      class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 focus:ring-2 focus:ring-aliva-blue focus:outline-none"
                      placeholder="0.00"
                    />
                  </div>
                </div>

                <div>
                  <label class="text-sm font-medium text-gray-600"
                    >Descripción</label
                  >
                  <textarea
                    id="npDescProducto"
                    required
                    rows="2"
                    class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 focus:ring-2 focus:ring-aliva-blue focus:outline-none"
                    placeholder="Ejemplo: Lavadero de acero inoxidable premium..."
                  ></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="text-sm font-medium text-gray-600"
                      >Stock</label
                    >
                    <input
                      type="number"
                      id="npStock"
                      step="1"
                      min="0"
                      required
                      class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 focus:ring-2 focus:ring-aliva-blue focus:outline-none"
                      placeholder="Ej. 10"
                    />
                  </div>
                  <div>
                    <label class="text-sm font-medium text-gray-600"
                      >Imagen (URL)</label
                    >
                    <input
                      type="text"
                      id="npImagen"
                      placeholder="https://..."
                      class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 focus:ring-2 focus:ring-aliva-blue focus:outline-none"
                    />
                  </div>
                </div>

                <div
                  class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pt-2 border-t border-gray-100"
                >
                  <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2">
                      <input
                        type="checkbox"
                        id="npRegalo"
                        class="w-4 h-4 text-aliva-blue focus:ring-aliva-blue"
                      />
                      <span class="text-sm text-gray-700"
                        >¿Es producto de regalo?</span
                      >
                    </label>
                    <label class="flex items-center gap-2">
                      <input
                        type="checkbox"
                        id="npEstado"
                        checked
                        class="w-4 h-4 text-aliva-blue focus:ring-aliva-blue"
                      />
                      <span class="text-sm text-gray-700">Activo</span>
                    </label>
                  </div>
                </div>
              </form>

              <!-- Footer -->
              <div
                class="flex justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl"
              >
                <button
                  onclick="cerrarModalNuevoProducto()"
                  class="px-5 py-2 rounded-lg text-gray-700 border border-gray-300 hover:bg-gray-100 transition"
                >
                  Cancelar
                </button>
                <button
                  onclick="guardarNuevoProducto()"
                  class="px-5 py-2 rounded-lg bg-aliva-blue text-white hover:bg-aliva-purple transition shadow-sm"
                >
                  Guardar producto
                </button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/ag-grid-community@31.3.0/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/js/navar.js" defer></script>
    <script src="/js/header.js" defer></script>

    <script src="/js/ListaProductos.js" defer></script>
  </body>
</html>
